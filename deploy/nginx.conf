# Reverse proxy for the containerized stack (mounted into the `nginx`
# service in docker-compose.yml). Routes by domain: the bare/www domain to
# the Next.js frontend container, api.<domain> to the Strapi backend
# container — both reached by their Docker Compose service name, not
# 127.0.0.1, since nginx now runs inside the same Docker network.
#
# "localhost" is included on the frontend block so this works immediately
# for local testing before a real domain/DNS is attached; swap
# VOTRE_DOMAINE for the real domain once one exists, then layer HTTPS on
# top (e.g. a certbot container or a cert mounted read-only here).

server {
    listen 80 default_server;
    server_name VOTRE_DOMAINE www.VOTRE_DOMAINE localhost;

    client_max_body_size 50M;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name api.VOTRE_DOMAINE;

    # Strapi media uploads can be large.
    client_max_body_size 50M;

    location / {
        proxy_pass http://backend:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
