# Override for hosting on a VPS that already runs other projects, including
# a shared Traefik instance (host network, Docker-label discovery, its own
# Let's Encrypt resolver named "letsencrypt" — see /docker/traefik-rmu2 on
# the server). Traefik terminates HTTPS for both services under one
# hostname: the frontend gets the bare Host() match, the backend (Strapi
# admin/API/uploads) gets a PathPrefix match with higher priority so it
# wins over the frontend's catch-all for those specific paths.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build backend frontend
# (nginx intentionally left out — Traefik is this VPS's reverse proxy, not it)

services:
  backend:
    # Kept for direct HTTP access during the HTTPS cutover; remove once
    # Traefik routing at https://srv1896005.hstgr.cloud is confirmed working.
    ports:
      - "8083:1337"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projet-sogeloc_internal"
      - "traefik.http.routers.sogeloc-backend.rule=Host(`srv1896005.hstgr.cloud`) && (PathPrefix(`/admin`) || PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/content-manager`) || PathPrefix(`/content-type-builder`) || PathPrefix(`/upload`) || PathPrefix(`/users-permissions`) || PathPrefix(`/i18n`) || PathPrefix(`/_health`))"
      - "traefik.http.routers.sogeloc-backend.entrypoints=websecure"
      - "traefik.http.routers.sogeloc-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sogeloc-backend.priority=100"
      - "traefik.http.services.sogeloc-backend.loadbalancer.server.port=1337"

  frontend:
    # Kept for direct HTTP access during the HTTPS cutover; remove once
    # Traefik routing at https://srv1896005.hstgr.cloud is confirmed working.
    ports:
      - "8082:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=projet-sogeloc_internal"
      - "traefik.http.routers.sogeloc-frontend.rule=Host(`srv1896005.hstgr.cloud`)"
      - "traefik.http.routers.sogeloc-frontend.entrypoints=websecure"
      - "traefik.http.routers.sogeloc-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sogeloc-frontend.priority=1"
      - "traefik.http.services.sogeloc-frontend.loadbalancer.server.port=3000"
