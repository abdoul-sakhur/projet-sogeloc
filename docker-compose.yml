# Production baseline. Local dev merges docker-compose.dev.yml on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Data safety: the Strapi database (SQLite) and uploaded media are bind-mounted
# from ./backend/.tmp and ./backend/public/uploads — the exact files already
# on disk — so containerizing does NOT start from an empty database. Nothing
# but nginx publishes a host port; frontend/backend are only reachable inside
# the "internal" network, reverse-proxied by nginx.

services:
  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
    volumes:
      - ./backend/.tmp:/opt/app/.tmp
      - ./backend/public/uploads:/opt/app/public/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1337/_health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:-http://localhost:1337}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        # `next build` prerenders pages that fetch Strapi data — it needs to
        # reach the backend, which the public URL above can't do from inside
        # an isolated build container. `network: internal` below attaches
        # the build to the same Compose network as the (already-running)
        # backend service, so this internal DNS name resolves.
        STRAPI_INTERNAL_URL: http://backend:1337
      network: internal
    restart: unless-stopped
    env_file: ./frontend/.env.local
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

networks:
  internal:
    driver: bridge
